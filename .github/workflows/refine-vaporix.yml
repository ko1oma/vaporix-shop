name: Refine Vaporix UI
on:
  push:
    paths:
      - '.github/workflows/refine-vaporix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply UI refinements
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text()
          s=re.sub(r'\n?\s*<[^>]*class=["\']profile-install["\'][^>]*>.*?</[^>]+>', '', s, flags=re.S)
          s=re.sub(r'\n?\s*<[^>]*class=["\']profile-more["\'][^>]*>.*?</[^>]+>', '', s, flags=re.S)
          s=re.sub(r'\.profile-install\{[^}]*\}(?:\.profile-install svg\{[^}]*\})?', '', s)
          s=re.sub(r'\.profile-more\{[^}]*\}', '', s)
          s=s.replace('.profile-install,.profile-more{display:none!important}\n','')
          gear=re.compile(r'<h2 class="profile-section-title">\s*<svg[^>]*>.*?</svg>\s*<span data-i18n="settings">.*?</span>\s*</h2>',re.S)
          s=gear.sub('''<h2 class="profile-section-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-1.7 1.7-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.1h-2.4v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L8 17l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.6-1H6.7v-2.4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L8 8.6l1.7-1.7.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.6v-.1h2.4v.1a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1 1.7 1.7-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.1V14h-.1a1.7 1.7 0 0 0-1.6 1Z"/></svg><span data-i18n="settings">Настройки</span></h2>''',s,count=1)
          info_html='''<section class="info-page" id="infoPage" aria-label="Информация"><div class="info-page-head"><div class="info-page-title"><span class="info-circle">i</span><h2 data-i18n="infoAdditional">Дополнительно</h2></div></div><div class="faq-card"><h3><span class="faq-q">?</span><span data-i18n="faqTitle">Часто задаваемые вопросы (FAQ)</span></h3><div class="faq-item open"><button type="button" onclick="toggleFaq(this)"><span>✣</span><span data-i18n="faqShotTitle">Правила для ICE Shot / Shot</span><b>⌃</b></button><div class="faq-answer" data-i18n="faqShotText">• Нельзя заказывать 1–2 шт.<br>• От 3 шт. — можно, либо при сумме корзины от примерно €12.<br>• Не комбинируется только с картриджами.<br>• Не учитывается в условиях бесплатной доставки.</div></div><div class="faq-item"><button type="button" onclick="toggleFaq(this)"><span>♔</span><span data-i18n="faqDeliveryTitle">Как получить бесплатную доставку?</span><b>⌄</b></button><div class="faq-answer" data-i18n="faqDeliveryText">• Одноразки / POD — от 2 шт.<br>• Жидкости / Salt — от 4 шт.<br>• Комбинация — от 3 шт. (минимум 1 электронка + 2 любых товара).</div></div><div class="support-note" data-i18n="supportNote">Остались вопросы? Обратитесь в команду поддержки, чтобы получить ответ.</div><a class="support-btn" href="https://t.me/cut3rainbow" target="_blank" rel="noopener"><span>♧</span><span data-i18n="supportBtn">Связаться с поддержкой</span></a></div></section>\n'''
          if 'id="infoPage"' not in s: s=s.replace('<nav class="bottom"',info_html+'<nav class="bottom"',1)
          s=re.sub(r'function showInfo\(\)\{.*?\}\s*function ', 'function showInfo(){document.getElementById(\'catalog\').classList.add(\'hidden\');document.getElementById(\'profile\').classList.remove(\'show\');document.getElementById(\'infoPage\').classList.add(\'show\');setNav(\'infoNav\');window.scrollTo({top:0,behavior:\'smooth\'})}\nfunction ', s, count=1, flags=re.S)
          s=re.sub(r'function showCatalog\(\)\{.*?\}\s*function ', 'function showCatalog(){document.getElementById(\'catalog\').classList.remove(\'hidden\');document.getElementById(\'profile\').classList.remove(\'show\');document.getElementById(\'infoPage\')?.classList.remove(\'show\');setNav(\'homeNav\');hideCart();window.scrollTo({top:0,behavior:\'smooth\'})}\nfunction ', s, count=1, flags=re.S)
          s=re.sub(r'function showProfile\(\)\{.*?\}\s*function ', 'function showProfile(){document.getElementById(\'catalog\').classList.add(\'hidden\');document.getElementById(\'infoPage\')?.classList.remove(\'show\');document.getElementById(\'profile\').classList.add(\'show\');setNav(\'profileNav\');updateTelegramUser();updateProfileLanguageUI();window.scrollTo({top:0,behavior:\'smooth\'})}\nfunction ', s, count=1, flags=re.S)
          if 'function toggleFaq' not in s: s=s.replace('function showInfo(){','function toggleFaq(btn){const item=btn.closest(\'.faq-item\');document.querySelectorAll(\'.faq-item\').forEach(x=>{if(x!==item)x.classList.remove(\'open\')});item.classList.toggle(\'open\');const b=btn.querySelector(\'b\');if(b)b.textContent=item.classList.contains(\'open\')?\'⌃\':\'⌄\'}\nfunction showInfo(){',1)
          if 'tg.expand();' in s and 'tg.disableVerticalSwipes' not in s: s=s.replace('tg.expand();','tg.expand();if(tg.disableVerticalSwipes)tg.disableVerticalSwipes();')
          s=s.replace('overscroll-behavior-x:none;touch-action:pan-y','overscroll-behavior-x:none;overscroll-behavior-y:contain;touch-action:pan-y')
          final_css='''<style id="vaporix-final-reference">.profile-topbar{display:flex!important;align-items:center;justify-content:flex-start!important;min-height:48px}.language-row{min-height:76px!important;border-radius:19px!important;padding:9px 13px!important;grid-template-columns:40px 1fr auto 19px!important;gap:9px!important}.language-leading{width:36px!important;height:36px!important}.language-leading svg{width:29px!important;height:29px!important}.language-copy b{font-size:16px!important}.language-copy small{font-size:12px!important}.language-row>strong{font-size:18px!important}.language-chevron{width:19px!important;height:19px!important}.info-page{display:none;padding:18px 10px 112px}.info-page.show{display:block}.info-page-head{background:#151518;border-radius:22px;padding:18px 16px;margin-bottom:14px}.info-page-title{display:flex;align-items:center;justify-content:center;gap:11px}.info-page-title h2{margin:0;font-size:24px}.info-circle{width:32px;height:32px;border:2px solid #a0a0aa;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#a0a0aa;font-size:20px}.faq-card{background:#151518;border-radius:22px;padding:18px 16px 16px}.faq-card h3{display:flex;align-items:center;gap:11px;font-size:20px;margin:0 0 12px}.faq-q{width:32px;height:32px;border:2px solid #a0a0aa;border-radius:50%;display:grid;place-items:center;color:#a0a0aa}.faq-item{border-bottom:1px solid #34343c;margin-bottom:2px}.faq-item button{width:100%;background:transparent;color:#f7f7fa;display:grid;grid-template-columns:24px 1fr 22px;gap:7px;align-items:center;text-align:left;padding:15px 0;font-size:16px}.faq-item button b{color:#a0a0aa;font-size:22px;text-align:right}.faq-answer{display:none;color:#a0a0aa;font-size:14px;line-height:1.45;padding:0 0 14px}.faq-item.open .faq-answer{display:block}.support-note{color:#a0a0aa;text-align:center;font-size:15px;line-height:1.45;padding:24px 10px 15px}.support-btn{height:56px;border-radius:18px;background:linear-gradient(100deg,#ff299e,#7c42ff);color:#09090b;text-decoration:none;font-weight:900;font-size:15px;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 10px 30px rgba(124,66,255,.28)}@media(min-width:721px){.info-page{max-width:820px;margin:0 auto;padding-bottom:130px}} </style>'''
          s=s.replace('</head>',final_css+'</head>',1)
          p.write_text(s)
          PY
      - name: Validate and commit
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          assert 'id="infoPage"' in s
          assert 'function showInfo' in s and 'function toggleFaq' in s
          assert 'disableVerticalSwipes' in s
          assert 'class="profile-install"' not in s and 'class="profile-more"' not in s
          assert '.profile-install{' not in s and '.profile-more{' not in s
          assert 'https://t.me/cut3rainbow' in s
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Refine Telegram Mini App UI [skip ci]'
          git push
