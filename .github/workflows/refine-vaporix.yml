name: Refine Vaporix UI
on:
  push:
    paths:
      - '.github/workflows/refine-vaporix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply UI refinements
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text()
          # Remove custom profile Install / more controls and their CSS entirely.
          s=re.sub(r'\n?\s*<[^>]*class=["\']profile-install["\'][^>]*>.*?</[^>]+>', '', s, flags=re.S)
          s=re.sub(r'\n?\s*<[^>]*class=["\']profile-more["\'][^>]*>.*?</[^>]+>', '', s, flags=re.S)
          s=re.sub(r'\.profile-install\{[^}]*\}(?:\.profile-install svg\{[^}]*\})?', '', s)
          s=re.sub(r'\.profile-more\{[^}]*\}', '', s)
          s=s.replace('.profile-install,.profile-more{display:none!important}\n','')
          # Replace the settings icon with a clean standard gear.
          gear=re.compile(r'<h2 class="profile-section-title">\s*<svg[^>]*>.*?</svg>\s*<span data-i18n="settings">.*?</span>\s*</h2>',re.S)
          s=gear.sub('''<h2 class="profile-section-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-1.7 1.7-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.1h-2.4v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L8 17l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.6-1H6.7v-2.4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L8 8.6l1.7-1.7.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.6v-.1h2.4v.1a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1 1.7 1.7-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.1V14h-.1a1.7 1.7 0 0 0-1.6 1Z"/></svg><span data-i18n="settings">Настройки</span></h2>''',s,count=1)
          # Compact language card on phones.
          s=s.replace('.language-row{min-height:80px;border-radius:20px;padding:10px 14px;grid-template-columns:42px 1fr auto 20px}', '.language-row{min-height:76px;border-radius:19px;padding:9px 13px;grid-template-columns:40px 1fr auto 19px}')
          s=s.replace('.language-leading{width:38px;height:38px}.language-leading svg{width:31px;height:31px}.language-copy b{font-size:17px}.language-copy small{font-size:13px}.language-row>strong{font-size:19px}.language-chevron{width:20px;height:20px}', '.language-leading{width:36px;height:36px}.language-leading svg{width:29px;height:29px}.language-copy b{font-size:16px}.language-copy small{font-size:12px}.language-row>strong{font-size:18px}.language-chevron{width:19px;height:19px}')
          # Convert the competitor's 50 PLN threshold to a rounded EUR equivalent.
          reps={'• От 3 шт. — можно.<br>• Не комбинируется только с картриджами.':'• От 3 шт. — можно, либо при сумме корзины от примерно €12.<br>• Не комбинируется только с картриджами.','• Від 3 шт. — можна.<br>• Не комбінується лише з картриджами.':'• Від 3 шт. — можна, або при сумі кошика від приблизно €12.<br>• Не комбінується лише з картриджами.','• Orders from 3 pcs are accepted.<br>• Not combined only with cartridges.':'• Orders from 3 pcs are accepted, or when the cart total is about €12 or more.<br>• Not combined only with cartridges.','• Desde 3 uds. sí.<br>• No se combina únicamente con cartuchos.':'• Desde 3 uds. sí, o con un carrito de aproximadamente €12 o más.<br>• No se combina únicamente con cartuchos.','• Ab 3 Stück möglich.<br>• Nicht nur mit Kartuschen kombinierbar.':'• Ab 3 Stück möglich oder bei einem Warenkorb von etwa €12 oder mehr.<br>• Nicht nur mit Kartuschen kombinierbar.'}
          for a,b in reps.items(): s=s.replace(a,b)
          # Keep Telegram expanded and disable vertical swipe-to-close when supported.
          if 'tg.expand();' in s and 'tg.disableVerticalSwipes' not in s: s=s.replace('tg.expand();','tg.expand();if(tg.disableVerticalSwipes)tg.disableVerticalSwipes();')
          s=s.replace('overscroll-behavior-x:none;touch-action:pan-y','overscroll-behavior-x:none;overscroll-behavior-y:contain;touch-action:pan-y')
          p.write_text(s)
          PY
      - name: Validate and commit
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          assert 'id="infoPage"' in s and 'function showInfo' in s and 'disableVerticalSwipes' in s
          assert 'Установить' not in s and 'profile-install' not in s and 'profile-more' not in s
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Refine Telegram Mini App UI [skip ci]'
          git push
