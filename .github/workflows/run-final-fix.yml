name: Run final storefront fix
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 fix_final.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add order_flow_runtime.js config.js index.html
          git commit -m 'Apply final storefront fixes: cart button and flavor chooser' || exit 0
          git rm fix_final.py .github/workflows/run-final-fix.yml
          git commit -m 'Apply final storefront fixes: cleanup'
          git push
