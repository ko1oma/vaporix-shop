name: Inject checkout script
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject script once
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<script src="vpx-checkout.js"></script>'
          if marker not in s:
              pos = s.lower().rfind('</body>')
              if pos < 0:
                  raise SystemExit('No </body> found in index.html')
              s = s[:pos] + marker + '\n' + s[pos:]
              p.write_text(s, encoding='utf-8')
      - name: Commit patch and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/inject-vpx.yml
          git commit -m "Add single-flavor cart and checkout to shop" || exit 0
          git push
