name: Assemble VAPORIX checkout
on:
  push:
    branches: [main]
    paths:
      - ".hotfix/vpx/**"
      - ".github/workflows/assemble-vpx.yml"
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble checkout
        run: cat .hotfix/vpx/part*.js > vpx-checkout.js
      - name: Commit generated checkout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vpx-checkout.js
          git commit -m "Deploy VAPORIX checkout hotfix [skip ci]"
          git push
