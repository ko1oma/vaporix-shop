name: Load VAPORIX stability patch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: !contains(github.event.head_commit.message, 'load vpx stability patch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject patch loader
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('config.js')
          s=p.read_text(encoding='utf-8')
          marker='vpx-stability-patch.js'
          if marker not in s:
              s += "\n\n// VAPORIX stability patch\ndocument.addEventListener('DOMContentLoaded',()=>{setTimeout(()=>{const s=document.createElement('script');s.src='vpx-stability-patch.js?v=1';document.body.appendChild(s)},100)}, {once:true});\n"
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config.js
          git diff --cached --quiet && exit 0
          git commit -m 'load vpx stability patch'
          git push
