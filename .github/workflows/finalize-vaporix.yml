name: Finalize VAPORIX shop
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final shop fixes
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<title>PUFF HUB — каталог</title>', '<title>VAPORIX — каталог</title>')
          css = '''<style id="vaporix-card-add-fix">
          .card-actions{grid-template-columns:1fr!important}
          .card-qty{display:none!important}
          .add-cart{width:100%!important}
          </style>'''
          if 'id="vaporix-card-add-fix"' not in s:
              pos = s.lower().rfind('</head>')
              if pos < 0: raise SystemExit('No </head> found')
              s = s[:pos] + css + '\n' + s[pos:]
          marker = '<script src="order_flow_runtime.js"></script>'
          if marker not in s:
              pos = s.lower().rfind('</body>')
              if pos < 0: raise SystemExit('No </body> found')
              s = s[:pos] + marker + '\n' + s[pos:]
          p.write_text(s, encoding='utf-8')
      - name: Remove temporary VPX files
        shell: bash
        run: |
          rm -f vpx-checkout.js vpx-stability-patch.js
          rm -rf .hotfix/vpx
          rm -f .github/workflows/load-vpx-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Restore VAPORIX checkout and remove temporary patches' || exit 0
          git push
      - name: Remove this workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/finalize-vaporix.yml
          git commit -m 'Remove one-time recovery workflow' || exit 0
          git push
