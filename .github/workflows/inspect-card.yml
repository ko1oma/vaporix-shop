name: Inspect card source
on:
  push:
    paths:
      - '.github/workflows/inspect-card.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract exact card render source
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          needles=['class="add-cart"','class="card-qty"','class="card-actions"','addToCart','showInfo(','function render(']
          out=[]
          for n in needles:
              poss=[]; start=0
              while True:
                  p=s.find(n,start)
                  if p<0: break
                  poss.append(p); start=p+1
              out.append('\n===== '+n+' count='+str(len(poss))+' =====')
              for p in poss[-5:]: out.append('\n--- POS '+str(p)+' ---\n'+s[max(0,p-2200):p+3500])
          Path('card-source-debug.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
      - name: Commit debug source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add card-source-debug.txt
          git commit -m 'Refresh card source diagnostic [skip ci]' || exit 0
          git push