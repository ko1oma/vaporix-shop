name: Finalize card fix
on:
  push:
    paths:
      - '.github/workflows/inspect-card.yml'
jobs:
  finalize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Bump stability patch cache version
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('config.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("vpx-stability-patch.js?v=1","vpx-stability-patch.js?v=5")
          p.write_text(s,encoding='utf-8')
          PY
      - name: Clean diagnostics
        run: rm -f card-source-debug.txt
      - name: Commit finalization
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config.js
          git rm -f card-source-debug.txt 2>/dev/null || true
          git rm -f .github/workflows/inspect-card.yml
          git commit -m 'Finalize real add-cart fix and remove diagnostics [skip ci]'
          git push