name: Inspect card source
on:
  push:
    paths:
      - '.github/workflows/inspect-card.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract card source
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          needles=['card-actions','add-cart','card-qty','showInfo','Добавить в корзину']
          out=[]
          for n in needles:
              p=s.find(n)
              if p>=0:
                  out.append('\n===== '+n+' =====\n'+s[max(0,p-2500):p+5000])
          Path('card-source-debug.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
      - name: Commit debug source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add card-source-debug.txt
          git commit -m 'Add card source diagnostic [skip ci]' || exit 0
          git push